services:
  hermes-mcp-bridge:
    image: "${CANDIDATE_IMAGE:-hermes-mcp-bridge:0.8.1-candidate}"
    container_name: hermes-mcp-bridge
    restart: unless-stopped
    init: true
    network_mode: host
    user: "${BRIDGE_UID:-1000}:${BRIDGE_GID:-1000}"
    volumes:
      - "${BRIDGE_STATE_DIR:-/home/estourpm/hermes-mcp-bridge/data}:/var/lib/hermes-mcp-bridge"
    env_file:
      - "${BRIDGE_ENV_FILE:-/home/estourpm/hermes-mcp-bridge/.env}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      BRIDGE_LOG_FORMAT: "${BRIDGE_LOG_FORMAT:-json}"
      BRIDGE_LOG_LEVEL: "${BRIDGE_LOG_LEVEL:-INFO}"
      BRIDGE_METRICS_ENABLED: "${BRIDGE_METRICS_ENABLED:-}"
      BRIDGE_METRICS_HOST: "${BRIDGE_METRICS_HOST:-127.0.0.1}"
      BRIDGE_METRICS_PORT: "${BRIDGE_METRICS_PORT:-9464}"
      BRIDGE_TRACING_ENABLED: "${BRIDGE_TRACING_ENABLED:-}"
      BRIDGE_TRACING_EXPORT: "${BRIDGE_TRACING_EXPORT:-}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m hermes_mcp_bridge.healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
