services:
  hermes-mcp-bridge:
    image: "${ROLLBACK_IMAGE:-hermes-mcp-bridge:rollback-0.8.0-9c7fc64}"
    container_name: hermes-mcp-bridge
    restart: unless-stopped
    init: true
    network_mode: host
    user: "${BRIDGE_UID:-1000}:${BRIDGE_GID:-1000}"
    volumes:
      - "${BRIDGE_STATE_DIR:-/home/estourpm/hermes-mcp-bridge/data}:/var/lib/hermes-mcp-bridge"
    env_file:
      - "${BRIDGE_ENV_FILE:-/home/estourpm/hermes-mcp-bridge/.env}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m hermes_mcp_bridge.healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
