# Alerting rules for hermes-mcp-bridge 1.0.0.
#
# Load into the existing Prometheus-compatible rule evaluator. Do not create a
# second Prometheus or duplicate rule group for the same target.
#
# Every expression uses bridge-owned metrics and bounded labels only. Target
# labels such as job, instance, service and environment are added by the scraper.

groups:
  - name: hermes-bridge.availability
    interval: 30s
    rules:
      - alert: HermesBridgeMetricsDown
        expr: up{job="hermes-mcp-bridge"} == 0
        for: 5m
        labels:
          severity: warning
          service: hermes-mcp-bridge
        annotations:
          summary: "Bridge metrics endpoint unreachable"
          description: >-
            The scraper cannot reach the loopback bridge exporter for 5m. This
            proves observability loss, not necessarily MCP endpoint failure.
          runbook: docs/observability-production-1.0.0.md#validation-sequence

      - alert: HermesBridgeRecentlyStarted
        expr: time() - bridge_process_start_time_seconds < 900
        for: 0m
        labels:
          severity: info
          service: hermes-mcp-bridge
        annotations:
          summary: "Bridge process started within the last 15 minutes"
          description: >-
            Expected inside an approved deployment window. Outside a change
            window, correlate with Docker RestartCount and the host journal.
          runbook: docs/observability-production-1.0.0.md#restart-interpretation

  - name: hermes-bridge.errors
    interval: 30s
    rules:
      - alert: HermesBridgeToolErrorRateHigh
        expr: >-
          sum by (job) (rate(bridge_tool_calls_total{outcome="error"}[5m]))
            /
          clamp_min(sum by (job) (rate(bridge_tool_calls_total[5m])), 1e-9)
            > 0.10
        for: 10m
        labels:
          severity: warning
          service: hermes-mcp-bridge
        annotations:
          summary: "Tool error ratio above 10%"
          description: >-
            More than 10% of tool calls failed over the last 5m, sustained for
            10m. Inspect redacted bridge.tool.call events with outcome=error.
          runbook: docs/observability-production-1.0.0.md#minimum-slos-and-indicators

      - alert: HermesBridgeUpstream5xxRatioHigh
        expr: >-
          sum by (job) (
            rate(bridge_upstream_requests_total{status_class="5xx"}[5m])
          )
            /
          clamp_min(
            sum by (job) (rate(bridge_upstream_requests_total[5m])),
            1e-9
          )
            > 0.05
        for: 10m
        labels:
          severity: warning
          service: hermes-mcp-bridge
        annotations:
          summary: "Hermes API 5xx ratio above 5%"
          description: >-
            The upstream Hermes API is returning sustained server errors. The
            bridge process may still be healthy while its dependency is not.
          runbook: docs/observability-production-1.0.0.md#minimum-slos-and-indicators

      - alert: HermesBridgeSqliteErrors
        expr: increase(bridge_sqlite_errors_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: hermes-mcp-bridge
        annotations:
          summary: "SQLite errors on the bridge state store"
          description: >-
            Any SQLite error is a durability signal affecting state, approvals,
            locks or migrations. Investigate before the next deployment.
          runbook: docs/observability-production-1.0.0.md#minimum-slos-and-indicators

      - alert: HermesBridgeObservabilityDegraded
        expr: increase(bridge_observability_errors_total[30m]) > 0
        for: 0m
        labels:
          severity: info
          service: hermes-mcp-bridge
        annotations:
          summary: "Observability pipeline reported internal errors"
          description: >-
            Telemetry is fail-open for execution, so requests continue, but the
            metrics or logs in this window may be incomplete.
          runbook: docs/observability-production-1.0.0.md#rollback

  - name: hermes-bridge.saturation
    interval: 30s
    rules:
      - alert: HermesBridgeShortReadOnlyLatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum by (job, le) (
              rate(
                bridge_tool_duration_seconds_bucket{
                  tool=~"hermes_(health|readiness|status|capabilities|agent_card|policy_evaluate|approval_status|result_manifest|recent_runs|checkpoint_status|saga_status|lock_status|quota_status)"
                }[10m]
              )
            )
          ) > 10
        for: 15m
        labels:
          severity: warning
          service: hermes-mcp-bridge
        annotations:
          summary: "p95 latency above 10s for short read-only tools"
          description: >-
            Long-running delegated tools are excluded. Sustained latency here
            indicates bridge, SQLite or upstream control-plane degradation.
          runbook: docs/observability-production-1.0.0.md#minimum-slos-and-indicators

      - alert: HermesBridgeSseFallbacks
        expr: sum by (job) (rate(bridge_sse_fallbacks_total[10m])) > 0.1
        for: 15m
        labels:
          severity: info
          service: hermes-mcp-bridge
        annotations:
          summary: "Event stream repeatedly falling back to polling"
          description: >-
            Functionally degraded but expected to remain correct. Inspect proxy
            and network handling of the SSE connection.
          runbook: docs/observability-production-1.0.0.md#minimum-slos-and-indicators

      - alert: HermesBridgeLockContention
        expr: increase(bridge_sqlite_lock_contention_total[10m]) > 20
        for: 10m
        labels:
          severity: warning
          service: hermes-mcp-bridge
        annotations:
          summary: "Sustained SQLite lock contention"
          description: >-
            Concurrent writers are backing off frequently. Confirm that no
            second bridge instance shares the same state database.
          runbook: docs/observability-production-1.0.0.md#minimum-slos-and-indicators
