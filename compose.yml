services:
  hermes-mcp-bridge:
    build: .
    image: ghcr.io/pestoura/hermes-mcp-bridge:local
    container_name: hermes-mcp-bridge
    restart: unless-stopped
    init: true
    network_mode: host
    user: "${BRIDGE_UID:-1000}:${BRIDGE_GID:-1000}"
    volumes:
      - "${BRIDGE_STATE_DIR:-./data}:/var/lib/hermes-mcp-bridge"
    env_file:
      - .env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m hermes_mcp_bridge.healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
