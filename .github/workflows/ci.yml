name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall src tests scripts

      - name: Lint
        run: python -m ruff check .

      - name: ShellCheck rollout scripts
        run: python -m pytest -q tests/test_rollout_scripts_0_8_2.py::test_shellcheck_clean

      - name: Test
        run: python -m pytest -q

      # Build and security artefacts are architecture/runtime gates, not Python
      # compatibility gates. Run them once on the production interpreter to
      # avoid duplicate images and duplicate SBOM uploads from the matrix.
      - name: Build runtime image
        if: matrix.python-version == '3.12'
        run: docker build --tag hermes-mcp-bridge:ci .

      - name: Scan runtime image (Trivy)
        if: matrix.python-version == '3.12'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hermes-mcp-bridge:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        if: matrix.python-version == '3.12'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hermes-mcp-bridge:ci
          scan-type: image
          format: cyclonedx
          output: sbom-cyclonedx.json

      - name: Validate generated SBOM
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("sbom-cyclonedx.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("SBOM was not generated")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("bomFormat") != "CycloneDX":
              raise SystemExit("unexpected SBOM format")
          if not isinstance(payload.get("components"), list) or not payload["components"]:
              raise SystemExit("SBOM contains no components")
          print(f"validated CycloneDX SBOM with {len(payload['components'])} components")
          PY

      # Retention is non-blocking because account-level storage quota is an
      # external operational constraint. Generation and structural validation
      # above remain mandatory release evidence.
      - name: Upload SBOM
        if: matrix.python-version == '3.12'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom-cyclonedx.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
