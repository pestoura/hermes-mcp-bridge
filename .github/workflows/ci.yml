name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall src tests scripts

      - name: Lint
        run: python -m ruff check .

      - name: ShellCheck rollout scripts
        run: python -m pytest -q tests/test_rollout_scripts_0_8_2.py::test_shellcheck_clean

      - name: Test
        run: python -m pytest -q

      - name: Build runtime image
        run: docker build --tag hermes-mcp-bridge:ci .

      - name: Scan runtime image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hermes-mcp-bridge:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hermes-mcp-bridge:ci
          scan-type: image
          format: cyclonedx
          output: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          if-no-files-found: error
