name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall src tests scripts

      - name: Lint
        run: python -m ruff check . --output-format=github

      - name: ShellCheck rollout scripts
        run: |
          python -m pytest -q \
            tests/test_rollout_scripts_0_8_2.py::test_shellcheck_clean \
            tests/test_rollout_scripts_0_9_0.py::test_shellcheck_clean \
            tests/test_rollout_scripts_1_0_0.py::test_shellcheck_clean

      - name: Test
        run: python -m pytest -q

  secret-scan:
    name: secret scan (tree + history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail-closed: a non-zero exit, scanned=false, or any finding blocks the
      # merge. The scanner never prints matched text, only a salted digest.
      - name: Run Phase 9 secret scan
        run: |
          python scripts/v2_phase9_secret_scan.py \
            --history-commits 25 \
            --json-out secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("secret-scan.json").read_text(encoding="utf-8"))
          if payload.get("scanned") is not True:
              raise SystemExit("secret scan did not run; scanned=false is a failure")
          if payload.get("finding_count", 1) != 0:
              raise SystemExit(f"secret scan reported {payload['finding_count']} finding(s)")
          scope = payload.get("scope") or {}
          if not scope.get("tree", {}).get("files"):
              raise SystemExit("secret scan covered no tree files")
          if scope.get("history", {}).get("commits", 0) <= 0:
              raise SystemExit("secret scan covered no history window")
          print(
              "secret scan clean: "
              f"{scope['tree']['files']} files, "
              f"{scope['history']['commits']} commits"
          )
          PY

  acceptance:
    name: image / isolated acceptance / trivy / sbom
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Generate Phase 1 registry acceptance evidence
        run: |
          python scripts/v2_phase1_registry_acceptance.py \
            --source-commit "${{ github.sha }}" \
            --json-out phase1-registry-acceptance.json

      - name: Validate Phase 1 registry acceptance evidence
        run: |
          python scripts/validate_v2_phase1_registry_evidence.py \
            phase1-registry-acceptance.json \
            --json-out phase1-registry-gate.json

      - name: Retain Phase 1 registry acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE1_EVIDENCE_TAG: phase1-registry-evidence-${{ github.sha }}
        run: |
          set -Eeuo pipefail

          EVIDENCE_SHA256="$(sha256sum phase1-registry-acceptance.json | awk '{print $1}')"
          GATE_SHA256="$(sha256sum phase1-registry-gate.json | awk '{print $1}')"
          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT

          cat >"$NOTES_FILE" <<EOF
          V2 Phase 1 canonical registry acceptance evidence.

          Tested commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Evidence SHA-256: ${EVIDENCE_SHA256}
          Gate SHA-256: ${GATE_SHA256}
          EOF

          if gh release view "$PHASE1_EVIDENCE_TAG" >/dev/null 2>&1; then
            gh release upload \
              "$PHASE1_EVIDENCE_TAG" \
              phase1-registry-acceptance.json \
              phase1-registry-gate.json \
              --clobber
          else
            gh release create \
              "$PHASE1_EVIDENCE_TAG" \
              phase1-registry-acceptance.json \
              phase1-registry-gate.json \
              --draft \
              --target "${{ github.sha }}" \
              --title "V2 Phase 1 registry evidence ${{ github.sha }}" \
              --notes-file "$NOTES_FILE"
          fi

          PHASE1_ASSET_COUNT="$(
            gh release view "$PHASE1_EVIDENCE_TAG" \
              --json assets \
              --jq '[.assets[] | select(.name == "phase1-registry-acceptance.json" or .name == "phase1-registry-gate.json")] | length'
          )"
          if [ "$PHASE1_ASSET_COUNT" != "2" ]; then
            echo "Phase 1 registry acceptance evidence was not retained"
            exit 1
          fi

          printf 'retained_phase1_evidence_tag=%s\n' "$PHASE1_EVIDENCE_TAG"
          printf 'retained_phase1_evidence_sha256=%s\n' "$EVIDENCE_SHA256"
          printf 'retained_phase1_gate_sha256=%s\n' "$GATE_SHA256"

      # Preserve the established step name because acceptance tests treat its
      # ordering as a release contract. The build itself carries immutable
      # provenance and is separately validated before isolated acceptance.
      - name: Build runtime image
        run: |
          set -Eeuo pipefail
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --build-arg OCI_IMAGE_REVISION="${{ github.sha }}" \
            --build-arg OCI_IMAGE_VERSION="1.0.0" \
            --build-arg OCI_IMAGE_CREATED="$CREATED" \
            --build-arg BRIDGE_BUILD_ID="${{ github.run_id }}.${{ github.run_attempt }}" \
            --build-arg BRIDGE_SCHEMA_VERSION="0.6.1" \
            --build-arg BRIDGE_CONTRACT_VERSION="1.0.0" \
            --tag hermes-mcp-bridge:ci \
            .

      - name: Validate image provenance
        run: |
          python scripts/validate_image_provenance.py \
            --image hermes-mcp-bridge:ci \
            --revision "${{ github.sha }}" \
            --version "1.0.0" \
            --build-id "${{ github.run_id }}.${{ github.run_attempt }}" \
            --schema-version "0.6.1" \
            --contract-version "1.0.0" \
            --output image-provenance.json

      - name: Accept candidate in isolated Docker stack
        run: |
          python scripts/isolated_acceptance_1_0_0.py \
            --image hermes-mcp-bridge:ci

      - name: Scan runtime image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hermes-mcp-bridge:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hermes-mcp-bridge:ci
          scan-type: image
          format: cyclonedx
          output: sbom-cyclonedx.json

      - name: Validate generated SBOM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("sbom-cyclonedx.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("SBOM was not generated")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("bomFormat") != "CycloneDX":
              raise SystemExit("unexpected SBOM format")
          if not isinstance(payload.get("components"), list) or not payload["components"]:
              raise SystemExit("SBOM contains no components")
          print(f"validated CycloneDX SBOM with {len(payload['components'])} components")
          PY

      # Preserve the established retention step/error contract while extending
      # the same blocking draft-release evidence with sanitized provenance.
      - name: Retain SBOM as release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TAG: sbom-evidence-${{ github.sha }}
        run: |
          set -Eeuo pipefail

          SBOM_SHA256="$(sha256sum sbom-cyclonedx.json | awk '{print $1}')"
          PROVENANCE_SHA256="$(sha256sum image-provenance.json | awk '{print $1}')"
          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT

          cat >"$NOTES_FILE" <<EOF
          Supply-chain evidence retained for Hermes MCP Bridge 1.0.0 acceptance.

          Tested commit: ${{ github.sha }}
          Build ID: ${{ github.run_id }}.${{ github.run_attempt }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SBOM SHA-256: ${SBOM_SHA256}
          Provenance SHA-256: ${PROVENANCE_SHA256}
          EOF

          if gh release view "$EVIDENCE_TAG" >/dev/null 2>&1; then
            gh release upload \
              "$EVIDENCE_TAG" \
              sbom-cyclonedx.json \
              image-provenance.json \
              --clobber
          else
            gh release create \
              "$EVIDENCE_TAG" \
              sbom-cyclonedx.json \
              image-provenance.json \
              --draft \
              --target "${{ github.sha }}" \
              --title "Supply-chain evidence ${{ github.sha }}" \
              --notes-file "$NOTES_FILE"
          fi

          ASSET_COUNT="$(
            gh release view "$EVIDENCE_TAG" \
              --json assets \
              --jq '[.assets[] | select(.name == "sbom-cyclonedx.json" or .name == "image-provenance.json")] | length'
          )"
          if [ "$ASSET_COUNT" != "2" ]; then
            echo "SBOM release evidence was not retained"
            exit 1
          fi

          printf 'retained_evidence_tag=%s\n' "$EVIDENCE_TAG"
          printf 'retained_sbom_sha256=%s\n' "$SBOM_SHA256"
          printf 'retained_provenance_sha256=%s\n' "$PROVENANCE_SHA256"
