name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall src tests scripts

      - name: Lint
        run: python -m ruff check . --output-format=github

      - name: ShellCheck rollout scripts
        run: |
          python -m pytest -q \
            tests/test_rollout_scripts_0_8_2.py::test_shellcheck_clean \
            tests/test_rollout_scripts_0_9_0.py::test_shellcheck_clean \
            tests/test_rollout_scripts_1_0_0.py::test_shellcheck_clean

      - name: Test
        run: python -m pytest -q

      # Build and security artefacts are architecture/runtime gates, not Python
      # compatibility gates. Run them once on the production interpreter to
      # avoid duplicate images and duplicate SBOM retention from the matrix.
      - name: Build runtime image
        if: matrix.python-version == '3.12'
        run: docker build --tag hermes-mcp-bridge:ci .

      - name: Accept candidate in isolated Docker stack
        if: matrix.python-version == '3.12'
        run: |
          python scripts/isolated_acceptance_1_0_0.py \
            --image hermes-mcp-bridge:ci

      - name: Scan runtime image (Trivy)
        if: matrix.python-version == '3.12'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hermes-mcp-bridge:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        if: matrix.python-version == '3.12'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hermes-mcp-bridge:ci
          scan-type: image
          format: cyclonedx
          output: sbom-cyclonedx.json

      - name: Validate generated SBOM
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("sbom-cyclonedx.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("SBOM was not generated")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("bomFormat") != "CycloneDX":
              raise SystemExit("unexpected SBOM format")
          if not isinstance(payload.get("components"), list) or not payload["components"]:
              raise SystemExit("SBOM contains no components")
          print(f"validated CycloneDX SBOM with {len(payload['components'])} components")
          PY

      # GitHub Actions artifact storage is quota-bound. Retain the validated
      # SBOM instead as a draft release asset tied to the exact tested SHA.
      # This step is intentionally blocking: release evidence is mandatory.
      - name: Retain SBOM as release evidence
        if: matrix.python-version == '3.12'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TAG: sbom-evidence-${{ github.sha }}
        run: |
          set -Eeuo pipefail

          SBOM_SHA256="$(sha256sum sbom-cyclonedx.json | awk '{print $1}')"
          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT

          cat >"$NOTES_FILE" <<EOF
          CycloneDX SBOM retained for Hermes MCP Bridge 1.0.0 acceptance.

          Tested commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SBOM SHA-256: ${SBOM_SHA256}
          EOF

          if gh release view "$EVIDENCE_TAG" >/dev/null 2>&1; then
            gh release upload \
              "$EVIDENCE_TAG" \
              sbom-cyclonedx.json \
              --clobber
          else
            gh release create \
              "$EVIDENCE_TAG" \
              sbom-cyclonedx.json \
              --draft \
              --target "${{ github.sha }}" \
              --title "SBOM evidence ${{ github.sha }}" \
              --notes-file "$NOTES_FILE"
          fi

          ASSET_COUNT="$(
            gh release view "$EVIDENCE_TAG" \
              --json assets \
              --jq '.assets | map(select(.name == "sbom-cyclonedx.json")) | length'
          )"
          if [ "$ASSET_COUNT" != "1" ]; then
            echo "SBOM release evidence was not retained"
            exit 1
          fi

          printf 'retained_sbom_tag=%s\n' "$EVIDENCE_TAG"
          printf 'retained_sbom_sha256=%s\n' "$SBOM_SHA256"
