name: Release governance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jds-002:
    name: JDS-002 change / validation records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release maintenance records
        uses: pestoura/jarvas-engineering-platform/.github/actions/release-governance@f25c8062bf3944560160de9419887fb7ad096918
        with:
          change-dir: changes
          campaign-dir: validation
